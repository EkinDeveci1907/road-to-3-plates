<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3 Plates">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Road to 3 Plates</title>
<style>
:root{
  --bg:#000000;--sf:#0E0E10;--sf2:#18181B;--sf3:#232327;--ln:#1C1C20;--ln2:#2E2E34;
  --tx:#FAFAFA;--tx2:#A1A1AA;--tx3:#8E8E98;--ac:#FAFAFA;--ac-tx:#000000;--red:#F87171;--blue:#60A5FA;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:20px;--rc:12px;--ease:cubic-bezier(.2,.8,.2,1);--fast:160ms;--med:260ms;--slow:420ms;
  --tab:60px;--finish:72px;color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.5 var(--f);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:transform var(--fast) var(--ease),background var(--fast),color var(--fast),border-color var(--fast),opacity var(--fast)}
button:active{transform:scale(.97)}
input{font:inherit;color:inherit}
a{color:var(--tx)}
svg{display:block}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:var(--rc);transform:translateY(-200%)}
.skip:focus{transform:none}
.wrap{max-width:520px;margin:0 auto;padding:8px 16px calc(var(--tab) + 40px + env(safe-area-inset-bottom,0px))}
body.has-finish .wrap{padding-bottom:calc(var(--tab) + var(--finish) + 96px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(250,250,250,.45)}100%{box-shadow:0 0 0 16px rgba(250,250,250,0)}}
@keyframes rep{0%,30%{opacity:0}50%,80%{opacity:1}100%{opacity:0}}
.enter{animation:fadeUp var(--med) var(--ease) both}
.enter>*:nth-child(2){animation-delay:40ms}.enter>*:nth-child(3){animation-delay:80ms}.enter>*:nth-child(4){animation-delay:120ms}.enter>*:nth-child(5){animation-delay:160ms}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px;margin-top:4px}
.brand{font-size:14px;font-weight:600;color:var(--tx2);letter-spacing:-.01em;margin:0}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sf3)}
.dots i.on{background:var(--tx3)}.dots i.now{background:var(--tx);box-shadow:0 0 0 3px rgba(250,250,250,.16)}
.dots span{font-size:12px;color:var(--tx3);margin-left:4px}
.date{margin:20px 0 0;font-size:13px;color:var(--tx2);font-weight:500}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.about{margin:0;color:var(--tx2);font-size:14px}
.pagehead h1{margin-top:20px}

/* segmented control */
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px;margin:18px 0 16px;isolation:isolate}
.seg__thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);background:var(--sf3);border-radius:10px;transition:transform var(--med) var(--ease);z-index:0}
.seg button{position:relative;z-index:1;padding:8px 2px;border-radius:10px;font-size:13px;font-weight:600;color:var(--tx3);line-height:1.2}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--tx3)}
.seg button[aria-pressed="true"]{color:var(--tx)}
.seg button[aria-pressed="true"] small{color:var(--tx2)}
.tip{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rc);padding:12px 14px;margin:16px 0 0;font-size:14px;color:var(--tx2);display:flex;gap:12px;align-items:flex-start}
.tip p{margin:0;flex:1}.tip b{color:var(--tx)}
.tip button{min-width:44px;min-height:44px;margin:-12px -14px -12px 0;color:var(--tx3);font-size:20px}

/* ---------- cards ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;margin-top:12px}
.card h2{font-size:15px;font-weight:600;margin:0;color:var(--tx)}
.eyebrow{font-size:13px;color:var(--tx2);margin:0}
.hero{position:relative;overflow:hidden}
.hero__num{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.hero__num .w{font-size:72px;line-height:1;font-weight:700;letter-spacing:-.045em}
.hero__num .u{color:var(--tx2);font-size:15px;line-height:1.3}
.hero__num .u b{display:block;color:var(--tx);font-size:22px;font-weight:600;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--sf2);border:1px solid var(--ln2);color:var(--tx)}
.chip--muted{background:transparent;color:var(--tx3);border-color:transparent;padding-left:2px;font-weight:500}
.chip--btn{min-height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.chip--btn:active{background:var(--sf3)}
.last{margin-top:14px;padding:12px 14px;background:var(--sf2);border-radius:var(--rc);display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;font-size:14px}
.last .k{color:var(--tx3);font-size:12px;font-weight:600}
.last .v{color:var(--tx);font-weight:500}
.last .v em{font-style:normal;color:var(--ac);font-weight:600}
.last .n{grid-column:2;color:var(--tx2);font-size:13px}
.loop{position:relative;margin:0 0 16px;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--sf2)}
.hero .loop{margin:-20px -20px 18px;border-radius:19px 19px 0 0}
.loop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08) brightness(.8)}
.loop img.b{opacity:0;animation:rep 2.8s ease-in-out infinite}
.loop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.88));pointer-events:none}
.loop figcaption{position:absolute;left:16px;right:16px;bottom:12px;z-index:1;font-size:12.5px;line-height:1.4;color:#E4E4E7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid{display:flex;align-items:center;gap:12px;background:var(--sf2);border-radius:var(--rc);padding:8px 14px 8px 8px;min-height:52px;text-decoration:none;color:var(--tx);margin-top:12px;transition:background var(--fast)}
.vid:active{background:var(--sf3)}
.vid__i{width:36px;height:36px;border-radius:50%;background:var(--tx);display:grid;place-items:center;flex:0 0 auto}
.vid__i svg{width:13px;height:13px;fill:var(--bg);margin-left:2px}
.vid b{flex:1;font-weight:600;font-size:14px}
.vid__s{font-size:13px;color:var(--tx3)}
.hint{margin:10px 0 0;font-size:14px;color:var(--tx2)}

/* sets */
.sethead,.set{display:grid;grid-template-columns:18px minmax(0,1.25fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.sethead{margin-top:16px;font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.02em;text-align:center}
.sethead span:first-child{text-align:left}
.set{margin-top:8px;transition:opacity var(--med)}
.set__n{font-size:13px;color:var(--tx3);font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;background:var(--sf2);border-radius:var(--rc);height:46px;border:1px solid transparent;transition:background var(--med),border-color var(--med)}
.step button{height:100%;font-size:20px;color:var(--tx3);border-radius:var(--rc)}
.step button:active{color:var(--tx);background:var(--sf3);transform:none}
.step input{width:100%;min-width:0;text-align:center;border:0;background:transparent;font-size:19px;font-weight:600;color:var(--tx);outline:none;padding:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.step input::placeholder{color:var(--tx3);opacity:1;font-weight:500}
.step:focus-within{border-color:var(--tx2)}
.set.is-done .step{background:rgba(250,250,250,.05);border-color:rgba(250,250,250,.16)}
.check{width:44px;height:44px;border-radius:50%;border:1.5px solid #3F3F46;display:grid;place-items:center;justify-self:end;color:var(--tx3);background:var(--sf)}
.check svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--fast)}
.check[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--ac-tx);animation:pop 320ms var(--ease),glow 600ms var(--ease)}
.tools{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:10px}
.link{color:var(--tx2);font-size:14px;font-weight:600;min-height:40px;padding:0 2px}
.link:active{color:var(--tx)}
.link--danger{color:var(--red)}
.field{width:100%;border:1px solid var(--ln2);background:var(--sf2);border-radius:var(--rc);padding:12px 14px;font-size:16px;color:var(--tx);outline:none;transition:border-color var(--fast)}
.field::placeholder{color:var(--tx3)}
.field:focus{border-color:var(--tx2)}
.flabel{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin:12px 0 6px}
.swap{margin-top:12px;padding:12px;background:var(--sf2);border-radius:var(--rc);animation:fadeUp var(--med) var(--ease)}
.swap .row{display:flex;gap:8px;margin-top:8px}
.swap .field{background:var(--sf)}
.btn{min-height:46px;padding:0 20px;border-radius:var(--rc);font-size:15px;font-weight:600;background:var(--tx);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn--ghost{background:var(--sf2);color:var(--tx);border:1px solid var(--ln2)}
.btn--danger{background:transparent;color:var(--red);border:1px solid var(--ln2)}

/* exercise list */
.list{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);margin-top:12px;overflow:hidden}
.ex{border-top:1px solid var(--ln)}
.ex:first-child{border-top:0}
.ex h2{margin:0;font:inherit}
.ex__head{width:100%;display:grid;grid-template-columns:1fr auto 20px;gap:2px 12px;padding:16px 16px 16px 20px;text-align:left;align-items:center;min-height:64px;border-radius:0}
.ex__head:active{background:var(--sf2);transform:none}
.ex__name{font-size:15px;font-weight:600;color:var(--tx);letter-spacing:-.01em}
.ex__sub{grid-column:1;font-size:13px;color:var(--tx3)}
.ex__sub em{font-style:normal;color:var(--tx2)}
.ex__tg{grid-column:2;grid-row:1 / span 2;text-align:right;font-size:15px;font-weight:600;color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.ex__tg small{display:block;font-size:12px;font-weight:500;color:var(--tx3)}
.ex__chev{grid-column:3;grid-row:1 / span 2;width:20px;height:20px;stroke:var(--tx3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--med) var(--ease)}
.ex.open .ex__chev{transform:rotate(180deg)}
.ex.is-complete .ex__name{color:var(--tx2)}
.ex.is-complete .ex__tg{color:var(--tx3)}
.ex__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--med) var(--ease)}
.ex.open .ex__body{grid-template-rows:1fr}
.ex__body>div{overflow:hidden;min-height:0}
.ex__inner{padding:0 20px 18px}
.count{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.count i{width:6px;height:6px;border-radius:50%;background:var(--sf3)}
.count i.on{background:var(--ac)}
.add-row{padding:6px 20px}
.dateline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 0;color:var(--tx3);font-size:13px}
.dateline input{background:var(--sf);border:1px solid var(--ln);border-radius:var(--rc);padding:8px 10px;color:var(--tx);min-height:40px}
.pr{position:absolute;top:16px;right:16px;background:var(--ac);color:var(--ac-tx);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;animation:pop 360ms var(--ease),glow 700ms var(--ease);letter-spacing:.02em}

/* receipt */
.receipt dl{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:16px 0;padding-top:14px;border-top:1px solid var(--ln)}
.receipt dt{color:var(--tx2);font-size:14px}.receipt dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.receipt .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- finish / tabs / timer / toast ---------- */
.finish{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--ln);transform:translateY(110%);visibility:hidden;transition:transform var(--med) var(--ease),visibility 0s var(--med)}
.finish.show{transform:none;visibility:visible;transition-delay:0s}
.finish__in{max-width:520px;margin:0 auto;height:var(--finish);padding:0 16px;display:flex;align-items:center;gap:12px}
.finish__meta{flex:1;min-width:0;font-size:13px;color:var(--tx2)}
.finish__meta b{color:var(--tx);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--sf3);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width var(--slow) var(--ease)}
.finish .btn{flex:0 0 auto;white-space:nowrap;padding:0 18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs ul{list-style:none;margin:0 auto;padding:0;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab)}
.tabs button{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;border-radius:0}
.tabs button:active{transform:none}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--med) var(--ease)}
.tabs button[aria-current="page"]{color:var(--tx)}
.tabs button[aria-current="page"] svg{transform:translateY(-1px)}
.timer{position:fixed;left:0;right:0;z-index:8;bottom:calc(var(--tab) + 12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;transform:translateY(140%);visibility:hidden;transition:transform var(--slow) var(--ease),visibility 0s var(--slow)}
body.has-finish .timer{bottom:calc(var(--tab) + var(--finish) + 10px + env(safe-area-inset-bottom,0px))}
.timer.show{transform:none;visibility:visible;transition-delay:0s}
.timer__in{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--sf2);border:1px solid var(--ln2);color:var(--tx);border-radius:999px;padding:6px 8px 6px 6px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.timer__ring{width:42px;height:42px}
.timer__ring circle{transition:stroke-dashoffset .25s linear}
.timer__time{font-size:22px;font-weight:600;min-width:72px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.timer__time small{display:block;font-size:11px;font-weight:500;color:var(--tx2)}
.timer button{background:var(--sf3);border-radius:999px;min-height:40px;padding:0 14px;font-weight:600;font-size:13px}
.timer.is-over .timer__in{border-color:var(--ac)}
.timer.is-over .timer__time{color:var(--ac)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:30;background:var(--sf2);border:1px solid var(--ln2);color:var(--tx);padding:10px 10px 10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:92vw;display:flex;align-items:center;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);transition:transform var(--med) var(--ease),opacity var(--med);opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast button{color:var(--ac);min-height:36px;padding:0 10px;border-radius:999px;background:var(--sf3)}

/* ---------- progress / food / history ---------- */
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.big .w{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.045em;color:var(--tx)}
.big span{color:var(--tx2);font-size:14px}
.track{position:relative;height:6px;background:var(--sf3);border-radius:3px;margin:22px 0 28px}
.track i{position:absolute;left:0;top:0;height:100%;background:var(--ac);border-radius:3px;transition:width var(--slow) var(--ease)}
.track b{position:absolute;top:-6px;width:2px;height:18px;background:var(--ln2);margin-left:-1px}
.track b span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--tx3);font-weight:600;white-space:nowrap}
.track b.hit{background:var(--ac)}
.track b:last-of-type span{left:auto;right:-1px;transform:none}
.miles{list-style:none;margin:8px 0 0;padding:0}
.miles li{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);font-size:14px}
.miles b{font-weight:600;font-variant-numeric:tabular-nums}
.miles .ok{color:var(--ac);font-weight:600}.miles .nx{color:var(--tx);font-weight:600}
.miles .muted{color:var(--tx3)}
.next{margin-top:14px;padding:12px 14px;background:var(--sf2);border-radius:var(--rc);font-size:14px;color:var(--tx2)}
.next b{color:var(--tx);font-size:18px;margin-right:6px;font-variant-numeric:tabular-nums}
.chart svg{width:100%;height:auto;margin-top:12px}
.road{list-style:none;margin:12px 0 0;padding:0}
.road li{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--ln);font-size:14px}
.road .wk{color:var(--tx3);font-size:13px}.road .tg{font-weight:600;font-variant-numeric:tabular-nums}
.road .res{font-size:13px;color:var(--tx3);text-align:right}
.road .hit .res{color:var(--ac);font-weight:600}.road .miss .res{color:var(--red);font-weight:600}
.road .now{color:var(--tx)}.road .now .wk{color:var(--ac)}
.fine{font-size:13px;color:var(--tx3);margin:12px 0 0;line-height:1.45}
.inline{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.rows{list-style:none;margin:12px 0 0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);font-size:14px;min-height:44px;color:var(--tx2)}
.rows li span:last-child{color:var(--tx);font-weight:500}
.meter{height:8px;background:var(--sf3);border-radius:4px;margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width var(--slow) var(--ease)}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macro div{background:var(--sf2);border-radius:var(--rc);padding:10px 12px}
.macro b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--tx3)}
.switches{list-style:none;margin:6px 0 0;padding:0}
.switches li{border-top:1px solid var(--ln)}
.switches label{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;min-height:56px}
.switches span{flex:1;font-size:15px}
.switches small{display:block;color:var(--tx3);font-size:12px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--sf3);position:relative;flex:0 0 auto;margin:0;cursor:pointer;transition:background var(--med)}

    saveDrafts();keepScroll(renderToday);return;}
  if(S.tab==='progress'){var inp2=document.getElementById('bwIn');
    if(act==='bwinc'||act==='bwdec'){var bv=num(inp2.value!==''?inp2.value:inp2.placeholder)||140;inp2.value=String(Math.round((bv+(act==='bwinc'?0.5:-0.5))*10)/10);return;}
    if(act==='bw'){var v2=num(inp2.value!==''?inp2.value:'');if(v2==null||v2<70||v2>400){toast('Type today’s weight in lbs, like 141.5.');refocus('#bwIn');return;}var t=todayStr();S.bw=S.bw.filter(function(x){return x.date!==t}).concat([{date:t,lbs:v2}]);if(persist())toast('Weigh-in saved');keepScroll(renderProgress);return;}
    if(act==='bwdel'){var dt=b.dataset.date,keep=S.bw.slice();S.bw=S.bw.filter(function(x){return x.date!==dt});persist();keepScroll(renderProgress);toast('Weigh-in removed','Undo',function(){S.bw=keep;persist();keepScroll(renderProgress);});return;}}
  if(S.tab==='food'){if(b.dataset.p){var g=+b.dataset.p;setChecks(function(day){day.protein=(day.protein||0)+g;day.pLog=(day.pLog||[]).concat([g]);});keepScroll(renderFood);return;}
    if(act==='pundo'){setChecks(function(day){var l=day.pLog||[];if(l.length){day.protein=Math.max(0,(day.protein||0)-l[l.length-1]);day.pLog=l.slice(0,-1);}});keepScroll(renderFood);return;}}
  if(S.tab==='history'){if(act==='hist'){S.openHist[b.dataset.id]=!S.openHist[b.dataset.id];keepScroll(renderHistory);return;}
    if(act==='del'){var id=b.dataset.id,gone=S.sessions.filter(function(x){return x.id===id})[0];S.sessions=S.sessions.filter(function(x){return x.id!==id});persist();keepScroll(renderHistory);toast('Workout deleted','Undo',function(){S.sessions.push(gone);persist();keepScroll(renderHistory);});return;}
    if(act==='backup')return shareFile('road-to-3-plates-backup-'+todayStr()+'.json',JSON.stringify({app:'road-to-235',version:3,sessions:S.sessions,bw:S.bw,checks:S.checks}),'application/json');
    if(act==='csv')return shareFile('road-to-3-plates-logs.csv',toCsv(),'text/csv');
    if(act==='restore')return document.getElementById('restoreIn').click();}
});
finishBtn.addEventListener('click',doSave);
document.getElementById('restoreIn').addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||o.app!=='road-to-235'||!Array.isArray(o.sessions))throw 0;var byId={};S.sessions.forEach(function(s){byId[s.id]=s});o.sessions.forEach(function(s){if(s&&s.id&&s.date)byId[s.id]=s;});S.sessions=Object.keys(byId).map(function(k){return byId[k]});
      var bwBy={};S.bw.concat(o.bw||[]).forEach(function(e){if(e&&e.date)bwBy[e.date]=e;});S.bw=Object.keys(bwBy).map(function(k){return bwBy[k]});if(o.checks&&typeof o.checks==='object')Object.keys(o.checks).forEach(function(k){S.checks[k]=o.checks[k];});if(persist())toast('Backup restored');render();}
    catch(e){toast('That file isn’t a Road to 3 Plates backup.');}ev.target.value='';};rd.readAsText(f);});
function toCsv(){var rows=[['date','workout','exercise','set','weight_lbs','reps','note']];sorted().reverse().forEach(function(s){(s.exercises||[]).forEach(function(e){if(!(e.sets||[]).length)rows.push([s.date,s.title,e.name,'','','',e.note||'']);(e.sets||[]).forEach(function(x,i){rows.push([s.date,s.title,e.name,i+1,x.w==null?'':x.w,x.r,i===0?(e.note||''):''])});});});
  return rows.map(function(r){return r.map(function(c){c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n');}
function shareFile(name,text,type){try{var file=new File([text],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});return;}}catch(e){}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);}catch(e){toast('Couldn’t create the file on this device.');}}
function doSave(){
  var w=workout(S.activeKey),d=draftFor(w.key),list=exList(w,d),exs=[],any=false,prs=0;
  list.forEach(function(rex){var e=d.ex[rex.key];if(!e)return;var ph=num(phWeight(rex,d.date));var sets=e.sets.filter(function(s){return s.r!==''}).map(function(s){if(s.pr)prs++;return {w:s.w===''?ph:num(s.w),r:num(s.r)};}).filter(function(s){return s.r!=null});if(sets.length)any=true;if(sets.length||e.note)exs.push({name:rex.name,target:rex.target,sets:sets,note:e.note||''});});
  if(!any){toast('Log at least one set first. Tap the check next to a set.');return;}
  var id=d.date+'-'+w.key,prior=S.sessions.filter(function(x){return x.id===id})[0]||null;
  var sess={id:id,date:d.date,key:w.key,title:w.name,plan:'new',week:weekIndex(d.date)+1,exercises:exs,prs:prs,savedAt:Date.now()};
  S.sessions=S.sessions.filter(function(x){return x.id!==id}).concat([sess]);if(!persist())return;
  S.undo={id:id,prior:prior,wasSaved:!!d.saved};d.saved=true;saveDrafts();stopTimer();window.scrollTo(0,0);renderToday();toast(prior?'Changes saved':w.name+' saved');
}
function undoSave(w,d){var id=d.date+'-'+w.key,u=S.undo&&S.undo.id===id?S.undo:null;S.sessions=S.sessions.filter(function(x){return x.id!==id});if(u&&u.prior)S.sessions.push(u.prior);persist();d.saved=u?u.wasSaved:false;saveDrafts();S.undo=null;keepScroll(renderToday);toast('Save undone. Your sets are still here.');}
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
render();
})();
</script>

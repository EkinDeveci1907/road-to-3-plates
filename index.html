<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3 Plates">
<meta name="theme-color" content="#134E4A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Road to 3 Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Mochiy+Pop+One&family=Yellowtail&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<!--
  Design system: "wet-market price board" (HK) × Sōetsu Yanagi (beauty through use).
  Tokens map to Tailwind palette/scale values. Radii differ by object on purpose:
  boards ≈ square plastic, controls rounded-md, tags/chips rounded-full.
-->
<style>
:root{
  /* global (Tailwind values) */
  --teal-950:#042F2E; --teal-900:#134E4A; --teal-800:#115E59; --teal-700:#0F766E; --teal-100:#CCFBF1; --teal-200:#99F6E4;
  --red-700:#B91C1C; --red-600:#DC2626; --red-50:#FEF2F2;
  --gray-900:#111827; --gray-700:#374151; --gray-600:#4B5563; --gray-400:#9CA3AF; --gray-300:#D1D5DB; --gray-200:#E5E7EB; --gray-100:#F3F4F6;
  --blue-600:#2563EB; --blue-200:#BFDBFE; --emerald-700:#047857; --amber-400:#FBBF24; --emerald-500:#10B981; --emerald-600:#059669; --emerald-50:#ECFDF5; --white:#FFFFFF;
  /* semantic */
  --bg-app:var(--teal-900); --bg-app-2:var(--teal-800); --board:var(--white); --ink:var(--gray-900); --ink-2:var(--gray-600);
  --on-app:var(--white); --on-app-2:var(--teal-100); --price:var(--red-600); --price-press:var(--red-700); --done:var(--emerald-600);
  --line:var(--gray-200); --field:var(--gray-100);
  /* type */
  --f-num:"Bungee","Arial Black",Impact,sans-serif; --f-head:"Mochiy Pop One","Arial Rounded MT Bold",sans-serif;
  --f-body:"Zen Maru Gothic",-apple-system,system-ui,sans-serif; --f-script:"Yellowtail","Brush Script MT",cursive;
  /* space (Tailwind 4px scale) */ --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  /* radius by object */ --r-board:2px; --r-control:6px; --r-full:999px;
  /* motion */ --ease:cubic-bezier(.2,.8,.2,1); --t-fast:150ms; --t-med:200ms;
  --tab:64px; --finish:76px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg-app);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg-app);color:var(--on-app);font:400 16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--gray-900);outline-offset:1px;box-shadow:0 0 0 5px var(--amber-400)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:var(--s4);top:calc(var(--s2) + env(safe-area-inset-top,0px));z-index:20;background:var(--board);color:var(--ink);padding:var(--s2) var(--s3);border-radius:var(--r-control);transform:translateY(-200%)}
.skip:focus{transform:none}
.wrap{max-width:520px;margin:0 auto;padding:var(--s3) var(--s4) calc(var(--tab) + var(--s10) + env(safe-area-inset-bottom,0px))}
body.has-finish .wrap{padding-bottom:calc(var(--tab) + var(--finish) + 96px + env(safe-area-inset-bottom,0px))}

/* ---------- app header ---------- */
.masthead{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.brand{font:400 26px/1 var(--f-script);color:var(--on-app);margin:0;transform:rotate(-3deg);transform-origin:left center}
.weeks{display:flex;align-items:center;gap:var(--s2);color:var(--on-app-2);font-size:14px}
.ticks{display:flex;gap:3px}
.ticks i{width:4px;height:16px;border-radius:1px;background:var(--teal-700)}
.ticks i.on{background:var(--on-app)}
.ticks i.now{background:var(--amber-400)}
.date{margin:var(--s3) 0 0;color:var(--on-app-2);font-weight:500}
h1{font:400 40px/1.1 var(--f-head);margin:var(--s1) 0 var(--s1);letter-spacing:.3px}
.about{margin:0;color:var(--on-app-2)}

/* workout picker: hanging tags */
.tags{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin:var(--s5) 0 var(--s6)}
.tag{background:var(--bg-app-2);border-radius:var(--r-control);padding:var(--s2) var(--s1);text-align:center;line-height:1.15;min-height:52px;color:var(--on-app);border:1px solid var(--teal-700)}
.tag b{display:block;font:400 15px var(--f-head)}
.tag small{font-size:12px;color:var(--on-app-2)}
.tag[aria-pressed="true"]{background:var(--board);color:var(--price);border-color:var(--board)}
.tag[aria-pressed="true"] small{color:var(--ink-2)}
.note{background:var(--bg-app-2);border:1px dashed var(--teal-200);border-radius:var(--r-control);padding:var(--s3) var(--s4);margin:var(--s4) 0 0;color:var(--on-app);font-size:15px;display:flex;gap:var(--s3);align-items:flex-start}
.note p{margin:0;flex:1}
.note button{min-width:44px;min-height:44px;margin:-12px -12px -12px 0;font-size:22px;color:var(--on-app-2)}

/* ---------- boards ---------- */
.board{position:relative;background:var(--board);color:var(--ink);border-radius:var(--r-board);box-shadow:0 1px 0 rgba(0,0,0,.25),0 8px 18px -10px rgba(4,47,46,.8)}
.hero{padding:var(--s8) var(--s4) var(--s4);margin-top:var(--s2);transform:rotate(-.6deg)}
.hero.swing{animation:swing 700ms var(--ease) both;transform-origin:50% -24px}
@keyframes swing{0%{transform:rotate(-5deg)}55%{transform:rotate(1.2deg)}80%{transform:rotate(-1deg)}100%{transform:rotate(-.6deg)}}
.clip{position:absolute;top:-10px;left:50%;width:56px;height:20px;margin-left:-28px;background:var(--gray-400);border:2px solid var(--gray-600);border-radius:5px}
.clip::before{content:"";position:absolute;left:50%;top:-26px;width:2px;height:24px;background:var(--gray-300);margin-left:-1px}
.hero h2{font:400 20px/1.2 var(--f-head);margin:0}
.price{display:flex;align-items:flex-end;gap:var(--s3);margin:var(--s2) 0 var(--s1);position:relative}
.price .w{font:400 88px/.9 var(--f-num);color:var(--price);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.price .unit{padding-bottom:6px;line-height:1.15}
.price .unit b{display:block;font:400 30px/1 var(--f-num);color:var(--ink)}
.price .unit span{font-size:14px;color:var(--ink-2);font-weight:500}
.price--sm .w{font-size:64px}
.plates{margin:var(--s2) -4px 0}
.plates svg{width:100%;height:auto}
.plates p{margin:var(--s1) 4px 0;font-size:14px;color:var(--ink-2)}
.hint,.last{margin:var(--s2) 0 0;font-size:14px}
.last{color:var(--ink-2)}
.last q{quotes:none;font-style:normal;color:var(--ink);background:var(--red-50);padding:0 var(--s1);border-radius:3px}

/* stacked boards list */
.stack{list-style:none;margin:var(--s4) 0 0;padding:0;display:grid;gap:var(--s2)}
.ex h2{margin:0;font:inherit}
.ex__head{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);padding:var(--s4);text-align:left;align-items:center;min-height:64px}
.ex__name{font:400 17px/1.25 var(--f-head);color:var(--ink)}
.ex__target{grid-column:2;grid-row:1 / span 2;text-align:right;font:400 17px/1.1 var(--f-num);color:var(--price);white-space:nowrap}
.ex__target small{display:block;font:500 12px var(--f-body);color:var(--ink-2)}
.ex__sub{font-size:13px;color:var(--ink-2)}
.count{display:inline-flex;gap:3px;vertical-align:middle;margin-left:var(--s2)}
.count i{width:8px;height:8px;border-radius:1px;border:1.5px solid var(--gray-400)}
.count i.on{background:var(--done);border-color:var(--done)}
.ex.is-complete .ex__name{color:var(--ink-2)}
.ex.is-complete .ex__target{color:var(--gray-400)}
.ex__body{padding:0 var(--s4) var(--s4);border-top:1px dashed var(--gray-300)}
.ex.is-open{outline:3px solid var(--amber-400);outline-offset:0}

/* sets */
.sethead,.set{display:grid;grid-template-columns:20px minmax(0,1.3fr) minmax(0,1fr) 48px;gap:var(--s2);align-items:center}
.sethead{margin:var(--s3) 0 0;font-size:12px;color:var(--ink-2);text-align:center}
.sethead span:first-child{text-align:left}
.set{margin-top:var(--s2)}
.set__n{font:400 16px var(--f-num);color:var(--gray-400);text-align:center}
.step{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;background:var(--field);border-radius:var(--r-control);height:48px;overflow:hidden;border:1.5px solid transparent}
.step button{height:100%;font-size:22px;color:var(--gray-700)}
.step button:active{background:var(--gray-200)}
.step input{width:100%;min-width:0;text-align:center;border:0;background:transparent;font:400 21px var(--f-num);color:var(--ink);outline:none;padding:0}
.step input::placeholder{color:var(--gray-400);opacity:1}
.step:focus-within{border-color:var(--gray-900)}
.check{width:48px;height:48px;border-radius:var(--r-full);border:2px solid var(--gray-300);display:grid;place-items:center;justify-self:end;background:var(--board)}
.check svg{width:22px;height:22px;stroke:var(--gray-400);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"] svg{stroke:var(--white)}
.set.is-done .step{background:var(--emerald-50)}
.set.is-done .step button{color:var(--gray-400)}
.tools{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);margin-top:var(--s3)}
.link{color:var(--teal-700);font-weight:700;min-height:44px;padding:0 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link--danger{color:var(--red-700)}
.field{width:100%;border:1.5px solid var(--gray-300);background:var(--board);border-radius:var(--r-control);padding:11px var(--s3);font-size:16px;color:var(--ink)}
.field::placeholder{color:var(--gray-600)}
.field:focus{border-color:var(--gray-900);outline:none}
.flabel{display:block;font-size:13px;color:var(--ink-2);margin:var(--s3) 0 var(--s1);font-weight:500}
.swap{margin-top:var(--s3);padding:var(--s3);background:var(--gray-100);border-radius:var(--r-control)}
.swap .row{display:flex;gap:var(--s2);margin-top:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.chip{background:var(--board);border:1.5px solid var(--gray-300);border-radius:var(--r-full);min-height:40px;padding:0 var(--s4);font-weight:500;color:var(--ink)}
.chip:active{background:var(--gray-200)}
.btn{min-height:48px;padding:0 var(--s5);border-radius:var(--r-control);font:400 16px var(--f-head);background:var(--price);color:var(--white)}
.btn:active{background:var(--price-press)}
.btn--ghost{background:var(--board);color:var(--ink);border:1.5px solid var(--gray-900)}
.add-ex{padding:var(--s4)}
.dateline{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin:var(--s5) 2px 0;color:var(--on-app-2);font-size:14px}
.dateline input{background:var(--bg-app-2);border:1px solid var(--teal-700);border-radius:var(--r-control);padding:var(--s2) var(--s3);color:var(--on-app);min-height:44px}
.stamp{position:absolute;right:var(--s4);top:var(--s6);font:400 38px/1 var(--f-script);color:var(--price);border:3px solid var(--price);border-radius:var(--r-control);padding:2px 10px 6px;transform:rotate(-12deg);background:rgba(255,255,255,.85);pointer-events:none}
.stamp.thunk{animation:thunk 260ms var(--ease) both}
@keyframes thunk{0%{transform:rotate(-12deg) scale(1.8);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}

/* done receipt */
.receipt{padding:var(--s6) var(--s4) var(--s4);margin-top:var(--s2)}
.receipt h2{font:400 22px var(--f-head);margin:0}
.receipt dl{display:grid;grid-template-columns:1fr auto;gap:var(--s2) var(--s4);margin:var(--s4) 0;border-top:1px dashed var(--gray-300);padding-top:var(--s3)}
.receipt dt{color:var(--ink-2)}
.receipt dd{margin:0;font:400 18px var(--f-num);color:var(--ink);text-align:right}
.receipt .actions{display:flex;gap:var(--s2);flex-wrap:wrap}

/* ---------- finish bar, timer, tabs, toast ---------- */
.finish{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:6;background:var(--teal-950);border-top:1px solid var(--teal-700)}
.finish__in{max-width:520px;margin:0 auto;height:var(--finish);padding:0 var(--s4);display:flex;align-items:center;gap:var(--s3)}
.finish__meta{flex:1;min-width:0;font-size:14px;color:var(--on-app-2)}
.finish .btn{flex:0 0 auto;white-space:nowrap;padding:0 14px;font-size:15px}
.finish__meta b{color:var(--on-app);font-family:var(--f-num);font-weight:400}
.bar{height:6px;background:var(--teal-800);border-radius:1px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--emerald-500)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--board);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--gray-300)}
.tabs ul{list-style:none;margin:0 auto;padding:0;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab)}
.tabs button{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray-600);font-size:12px;font-weight:700}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--price)}
.timer{position:fixed;left:0;right:0;z-index:8;bottom:calc(var(--tab) + var(--s3) + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
body.has-finish .timer{bottom:calc(var(--tab) + var(--finish) + var(--s2) + env(safe-area-inset-bottom,0px))}
.timer__in{pointer-events:auto;display:flex;align-items:center;gap:var(--s3);background:var(--price);color:var(--white);border-radius:var(--r-full);padding:6px 8px 6px 6px;box-shadow:0 10px 30px rgba(4,47,46,.6)}
.timer__ring{width:44px;height:44px}
.timer__time{font:400 26px/1 var(--f-num);min-width:70px;font-variant-numeric:tabular-nums}
.timer__time small{display:block;font:700 12px var(--f-body)}
.timer button{background:rgba(0,0,0,.18);border-radius:var(--r-full);min-height:44px;padding:0 var(--s4);font-weight:700;font-size:14px}
.timer.is-over .timer__in{background:var(--done)}
.toast{position:fixed;left:50%;top:calc(var(--s3) + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--gray-900);color:var(--white);padding:var(--s2) var(--s2) var(--s2) var(--s4);border-radius:var(--r-control);font-weight:700;max-width:92vw;display:flex;align-items:center;gap:var(--s3);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast button{color:var(--amber-400);font-weight:700;min-height:40px;padding:0 var(--s3);text-decoration:underline}

/* ---------- progress / food / history ---------- */
.section-title{font:400 18px var(--f-head);margin:var(--s8) 0 var(--s3);color:var(--on-app)}
.pad{padding:var(--s5) var(--s4) var(--s4)}
.pad h2{font:400 20px/1.2 var(--f-head);margin:0}
.sub{margin:var(--s1) 0 0;color:var(--ink-2);font-size:14px}
.roadbar svg{width:100%;height:auto;margin-top:var(--s3)}
.roadnums{display:flex;align-items:flex-end;gap:var(--s3);margin-top:var(--s2)}
.roadnums .w{font:400 64px/.9 var(--f-num);color:var(--price)}
.roadnums span{font-size:14px;color:var(--ink-2);padding-bottom:6px}
.miles{list-style:none;margin:var(--s4) 0 0;padding:0;border-top:1px dashed var(--gray-300)}
.miles li{display:grid;grid-template-columns:72px 1fr auto;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-bottom:1px dashed var(--gray-300);font-size:15px}
.miles b{font:400 20px var(--f-num)}
.miles .ok{color:var(--emerald-700);font-weight:700}
.miles .next{color:var(--price);font-weight:700}
.nexttop{margin-top:var(--s4);padding:var(--s3);background:var(--red-50);border-radius:var(--r-control);font-size:15px}
.nexttop b{font:400 22px var(--f-num);color:var(--red-700);margin-right:var(--s2)}
.chart svg{width:100%;height:auto;margin-top:var(--s3)}
.road{list-style:none;margin:var(--s3) 0 0;padding:0}
.road li{display:grid;grid-template-columns:62px 1fr auto;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-top:1px dashed var(--gray-300);font-size:15px}
.road .tg{font:400 17px var(--f-num)}
.road .res{font-size:14px;color:var(--ink-2);text-align:right}
.road .hit .res{color:var(--emerald-700);font-weight:700}
.road .miss .res{color:var(--red-700);font-weight:700}
.road .now{background:#FFFBEB;box-shadow:inset 3px 0 0 var(--amber-400)}
.road .wk{color:var(--ink-2);padding-left:var(--s2)}
.inline{display:grid;grid-template-columns:1fr auto;gap:var(--s2);margin-top:var(--s3)}
.rows{list-style:none;margin:var(--s3) 0 0;padding:0}
.rows li{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--gray-300);font-size:15px;min-height:44px}
.bigrow{display:flex;align-items:flex-end;gap:var(--s2);margin-top:var(--s2)}
.bigrow .w{font:400 56px/.9 var(--f-num);color:var(--price)}
.bigrow span{color:var(--ink-2);font-size:14px;padding-bottom:4px}
.meter{height:14px;background:var(--gray-100);border-radius:2px;margin-top:var(--s3);overflow:hidden;border:1px solid var(--gray-300)}
.meter i{display:block;height:100%;background:var(--emerald-500)}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin-top:var(--s3)}
.macro div{border:1.5px dashed var(--gray-300);border-radius:var(--r-board);padding:var(--s2) var(--s3)}
.macro b{display:block;font:400 22px var(--f-num);color:var(--ink)}
.macro span{font-size:13px;color:var(--ink-2)}
.switches{list-style:none;margin:var(--s2) 0 0;padding:0}
.switches li{border-top:1px dashed var(--gray-300)}
.switches label{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;cursor:pointer;min-height:56px}
.switches span{flex:1}
.switches small{display:block;color:var(--ink-2);font-size:13px}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:var(--r-full);background:var(--gray-300);position:relative;flex:0 0 auto;margin:0;cursor:pointer;transition:background var(--t-med) var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform var(--t-med) var(--ease)}
.switch:checked{background:var(--done)}
.switch:checked::after{transform:translateX(20px)}
.fine{font-size:13px;color:var(--ink-2);margin:var(--s3) 0 0}
.tips{margin:var(--s2) 0 0;padding-left:18px;font-size:15px}
.hist{margin-top:var(--s2)}
.hist__head{width:100%;display:grid;grid-template-columns:56px 1fr;gap:var(--s3);align-items:center;padding:var(--s3);text-align:left;min-height:64px}
.day{border:2px solid var(--price);border-radius:var(--r-board);text-align:center;padding:4px 0;line-height:1;color:var(--price)}
.day b{display:block;font:400 22px var(--f-num)}
.day span{font-size:11px;font-weight:700}
.hist__title{font:400 16px/1.2 var(--f-head);color:var(--ink)}
.hist__sum{display:block;font-size:13px;color:var(--ink-2)}

function roadWeek(wi){
  var i=Math.max(0,wi); if(i>10) return null;

/* After the 11-week block: keep climbing from your own last top set. */
function autoTop(lift, before){
  var names = lift==='bench'?['Bench press – top set','Bench press']:['Squat – top set','Squat'], best=null;
  sorted().some(function(s){ if(s.date>=before) return false;

    return !!best; });
  if(!best) return {w:lift==='bench'?185:185,reps:'5',sets:1};
  return {w:best.r>=3?best.w+5:best.w, reps:'3–5', sets:1, auto:true, from:best};
}
function resolveEx(ex, wi, before){
  var rw=roadWeek(wi), r={name:ex.name,label:ex.label||ex.name,rest:ex.rest,bar:!!ex.bar,bw:!!ex.bw,hint:ex.hint||'',kind:ex.kind||null};
  if (ex.kind){

      if(/Top/.test(ex.kind)) t=top; else if(ex.kind==='benchVol') t={w:r5(top.w*0.72),reps:'8',sets:3}; else t={w:r5(top.w*0.85),reps:'5–6',sets:3};
      if(top.auto && /Top/.test(ex.kind)) r.hint='Last best top set '+top.from.w+' × '+top.from.r+'. Hit 3+ reps and it moves up 5.'; }
    r.sets=t.sets; r.reps=t.reps; r.w=t.w; r.easy=!!t.easy;
    r.target = t.sets===1 ? t.w+' × '+t.reps : t.sets+' × '+t.reps+' @ '+t.w;
    if (t.extra) r.hint=t.extra;
    return r;
  }
  r.sets=ex.sets; r.reps=ex.reps; r.w=null;
